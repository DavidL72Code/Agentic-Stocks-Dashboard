<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monsoon — stock research you can check</title>
<meta name="description" content="Live quotes, SEC financials and a multi-agent research assistant that checks every figure it quotes. Informational only.">
<meta name="theme-color" content="#0a0d12">
<meta property="og:title" content="Monsoon — stock research you can check">
<meta property="og:description" content="Live quotes, SEC financials and a research agent that checks every figure it quotes.">
<meta property="og:type" content="website">
<script>
  /* theme before first paint, so it never flashes */
  try { document.documentElement.dataset.theme = localStorage.getItem("monsoon.theme") || "dark"; }
  catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1117'/%3E%3Cpath d='M12 4.5c3.3 3.7 5.1 6.1 5.1 8.4a5.1 5.1 0 1 1-10.2 0c0-2.3 1.8-4.7 5.1-8.4Z' fill='none' stroke='%235b9bea' stroke-width='1.9' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui.css?v=__BUILD__">
<script defer src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="brand" href="#/dashboard" aria-label="Monsoon home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8c4 4.5 6.2 7.4 6.2 10.2a6.2 6.2 0 1 1-12.4 0C5.8 10.2 8 7.3 12 2.8Z"/><path d="M8.9 14.2l2-2.2 2 1.7 2.2-2.8"/></svg>
      <span>Monsoon</span>
    </a>
    <nav id="nav" aria-label="Main">
      <a class="navitem" data-route="dashboard" href="#/dashboard">Markets</a>
      <a class="navitem" data-route="ticker" href="#/t/NVDA">Research</a>
      <a class="navitem" data-route="brief" href="#/brief">Brief<span class="navdot" id="navdot" aria-label="new today"></span></a>
      <a class="navitem" data-route="portfolio" href="#/portfolio">Portfolio</a>
    </nav>
    <button id="cmdk" type="button" aria-label="Search tickers or ask the agent">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <span>Search a ticker or ask a question</span><kbd>⌘K</kbd></button>
    <div class="grow"></div>
    <div id="mktstatus" role="status"></div>
    <div id="pfsummary"></div>
    <button id="themebtn" class="btn btn-sm btn-ghost" type="button" aria-label="Switch light or dark" title="Light / dark">
      <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button id="agenttoggle" class="btn btn-sm" type="button" aria-expanded="false" aria-controls="right">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.2l1.75 4.8 4.8 1.75-4.8 1.75-1.75 4.8-1.75-4.8L4 9.75l4.75-1.75z"/><path d="M17.8 14.4l.85 2.3 2.3.85-2.3.85-.85 2.3-.85-2.3-2.3-.85 2.3-.85z"/></svg>
      <span class="lbl">Ask Monsoon</span></button>
    <div id="acct"></div>
    <div id="crumbs" aria-hidden="true"></div>
    <span id="buildstamp" aria-hidden="true"></span>
  </header>

  <div id="tape" aria-label="Markets"></div>

  <div id="body">
    <main id="shell"><div id="views"></div></main>

    <!-- the research agent: a drawer that docks beside the page on wide screens -->
    <aside id="right" aria-label="Research agent">
      <div id="rhead">
        <span class="dot" id="rdot"></span>
        <span class="t">Ask Monsoon</span>
        <!-- static, so the disclaimer is in the page itself, not only in script -->
        <button type="button" class="itip" id="agentinfo" aria-label="How the agent works" aria-expanded="false"
                data-tip="&lt;div class=&quot;tiph&quot;&gt;How the agent works&lt;/div&gt;&lt;p&gt;A router sends your question to the specialists it needs (price, company finances, analysts and news, earnings, related stocks, the economy), and they work in parallel. Every figure in the answer is checked against the data they fetched and links the page it came from.&lt;/p&gt;&lt;p&gt;Informational only, not financial advice. Monsoon summarises public data and cannot account for your circumstances.&lt;/p&gt;&lt;p&gt;Press &lt;kbd&gt;/&lt;/kbd&gt; to ask from anywhere.&lt;/p&gt;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6v.01"/></svg></button>
        <span class="st" id="rst" role="status">ready</span>
        <button class="btn btn-ghost btn-sm" id="agentnew" title="New conversation" aria-label="New conversation">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="btn btn-ghost btn-sm" id="agentclose" title="Close" aria-label="Close the agent">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="rscroll"><div id="thread" aria-live="polite"></div></div>
      <div id="askwrap">
        <div id="askscope"></div>
        <form id="askform">
          <textarea id="ask" rows="1" placeholder="Ask about any stock or the market…"
                    autocomplete="off" aria-label="Ask the research agent"></textarea>
          <button id="send" class="btn btn-primary" type="submit" aria-label="Ask" title="Ask">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
      </div>
    </aside>
  </div>
</div>

<div id="authsheet">
  <div id="authbox" role="dialog" aria-modal="true" aria-labelledby="authttl">
    <div class="ttl" id="authttl">Sign in to Monsoon</div>
    <div class="sub" id="authsub">Your watchlist, portfolios and cost basis live with your account.</div>
    <div class="authtabs">
      <button type="button" data-mode="login">Sign in</button>
      <button type="button" data-mode="register">Create account</button>
    </div>
    <div id="autherr"></div>
    <form id="authform" autocomplete="on">
      <div class="fld">
        <label for="authuser">Username</label>
        <input class="inp" id="authuser" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="fld">
        <label for="authpass">Password</label>
        <input class="inp" id="authpass" name="password" type="password" required>
      </div>
      <div class="pwhint" id="authpwhint" style="display:none">At least 10 characters.</div>
      <button class="btn btn-primary" id="authsubmit" type="submit">Sign in</button>
    </form>
    <div class="authfoot">
      <span id="authswitch"></span>
      <div class="grow"></div>
      <button type="button" id="authcancel">Keep browsing as guest</button>
    </div>
  </div>
</div>

<div id="trace">
  <div id="tbox" role="dialog" aria-modal="true" aria-labelledby="tttl">
    <div id="thead">
      <div><div class="t" id="tttl">Evidence</div><div class="s" id="tsub"></div></div>
      <div class="grow"></div>
      <button class="btn btn-ghost btn-sm" id="tclose">Close</button>
    </div>
    <div id="tbody"></div>
  </div>
</div>

<!-- Same origin by default. Uncomment and set this ONLY if the API is on a
     different origin than this page, which also needs the server switched to
     SameSite=None - see HOSTING.md. The Vercel setup proxies /api/* instead,
     precisely so this stays unnecessary. -->
<!-- <script>window.MONSOON_API = "https://monsoon-api.onrender.com";</script> -->

<!-- ⌘K: jump to any ticker, view or question -->
<div id="cmdpal" role="dialog" aria-modal="true" aria-label="Search">
  <div id="cmdbox">
    <div class="cmdin"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <input id="cmdq" placeholder="Search tickers, pages, or ask the agent…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd></div>
    <div id="cmdres" role="listbox"></div>
  </div>
</div>

<div id="pwsheet" role="dialog" aria-modal="true" aria-labelledby="pwttl">
  <form id="pwbox" autocomplete="on">
    <div class="ttl" id="pwttl">Change password</div>
    <div class="sub">Other signed-in sessions are signed out when you change it.</div>
    <div class="fld"><label for="pwcur">Current password</label>
      <input class="inp" id="pwcur" type="password" autocomplete="current-password" required></div>
    <div class="fld"><label for="pwnew">New password</label>
      <input class="inp" id="pwnew" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="fld"><label for="pwnew2">Confirm new password</label>
      <input class="inp" id="pwnew2" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="err" id="pwerr"></div>
    <div class="acts"><button class="btn btn-primary" id="pwgo" type="submit">Change password</button>
      <button class="btn btn-ghost" id="pwcx" type="button">Cancel</button></div>
  </form>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="/static/app.js?v=__BUILD__"></script>
</body>
</html>
